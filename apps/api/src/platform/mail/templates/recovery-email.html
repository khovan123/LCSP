<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LCSP password recovery</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
      color: #14213d;
    "
  >
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 560px;
              background: #ffffff;
              border-radius: 16px;
              padding: 32px;
            "
          >
            <tr>
              <td>
                <h1 style="margin: 0 0 16px; font-size: 24px; line-height: 1.3">
                  Password recovery
                </h1>
                <p style="margin: 0 0 16px; font-size: 16px; line-height: 1.6">
                  A password recovery request was received for your LCSP
                  account.
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{recoveryLink}}"
                    style="
                      display: inline-block;
                      padding: 12px 18px;
                      border-radius: 10px;
                      background: #14213d;
                      color: #ffffff;
                      text-decoration: none;
                      font-weight: 600;
                    "
                    >Open the recovery page</a
                  >
                </p>
                <p
                  style="
                    margin: 0;
                    font-size: 14px;
                    line-height: 1.6;
                    color: #4b5563;
                  "
                >
                  If you did not request this, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
