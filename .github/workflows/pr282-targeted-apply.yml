name: PR 282 targeted Interview patch

on:
  push:
    branches:
      - feat/LCSP-278-add-responsive-interaction-regression-coverage

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/LCSP-278-add-responsive-interaction-regression-coverage
          fetch-depth: 0

      - name: Align guarded continuation helper patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/pr282_targeted_fix.py")
          content = path.read_text(encoding="utf-8")
          start = content.index("# Update helper signature/body near bottom without relying on exact prose body.")
          end = content.index("# ---------------------------------------------------------------------------\n# API E2E", start)
          replacement = '''# Replace the exact current guarded downstream helper with a continuation-aware version.\nreplace_between(\n    boundary,\n    "def _guarded_downstream_prompt(\\n",\n    "def _required_text(",\n    ''' + "'''" + '''def _guarded_downstream_prompt(\n    *,\n    assessment_id: str,\n    thread_id: str,\n    context_revision: int,\n    pge_version: str,\n    outcome: str,\n    continuation: dict[str, Any] | None = None,\n) -> str:\n    if outcome == "CONTEXT_READY":\n        action = (\n            "Continue from the already-accepted guarded Initial Interview state into the "\n            "existing EngineeringRule readiness/Planner flow."\n        )\n    else:\n        action = (\n            "Continue only the persisted targeted clarification path and resume the exact "\n            "Investigator after validating its server-owned origin, scope and artifact pins."\n        )\n    continuation_clause = (\n        " Resume only the exact server-owned Investigator continuation: "\n        + json.dumps(continuation, ensure_ascii=False, sort_keys=True)\n        if continuation is not None\n        else ""\n    )\n    return (\n        f"{action} Do not re-evaluate Customer text in Root and do not bypass the persisted "\n        f"Interview guard. Assessment: {assessment_id}. Thread: {thread_id}. "\n        f"Context revision: {context_revision}. PGE version: {pge_version}."\n        + continuation_clause\n    )\n\n\n''' + "'''" + ''',\n)\n\n'''
          path.write_text(content[:start] + replacement + content[end:], encoding="utf-8")
          PY

      - name: Apply server-owned targeted Interview patch
        run: python scripts/pr282_targeted_fix.py

      - name: Validate patch shape
        run: |
          git diff --check
          python -m py_compile \
            deepagents/contracts/handoffs.py \
            deepagents/middleware/specialist_handoff_validation.py \
            deepagents/tools/common/capabilities/platform/api_client.py \
            deepagents/tools/common/capabilities/workflow/recovery/interview_boundary.py \
            deepagents/tests/test_targeted_interview_registration.py
          git status --short

      - name: Commit patch
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: LCSP-278 persist server-owned targeted Interview continuation"
          git push origin HEAD:feat/LCSP-278-add-responsive-interaction-regression-coverage
