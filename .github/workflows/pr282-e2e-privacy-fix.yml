name: PR 282 E2E privacy fix

on:
  push:
    branches:
      - feat/LCSP-278-add-responsive-interaction-regression-coverage
    paths:
      - .github/workflows/pr282-e2e-privacy-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'khovan123/LCSP'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/LCSP-278-add-responsive-interaction-regression-coverage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded patch
        run: python scripts/pr282_e2e_privacy_fix.py
      - name: Validate diff
        run: git diff --check
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/modules/assessment/application/services/assessment-interview-runtime.service.ts \
            apps/api/test/assessment-interview.e2e-spec.ts
          git diff --cached --quiet && { echo "No production changes to commit"; exit 1; }
          git commit -m "fix: LCSP-278 redact Interview runtime drafts"
          git push origin HEAD:feat/LCSP-278-add-responsive-interaction-regression-coverage
