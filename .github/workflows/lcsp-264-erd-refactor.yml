name: LCSP-264 optimized ERD refactor

on:
  push:
    branches:
      - refactor/LCSP-264-optimized-erd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/LCSP-264-optimized-erd
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply deterministic refactor
        run: python3 scripts/lcsp264_apply_optimized_erd.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and generate Prisma client
        run: |
          pnpm --filter @lcsp/api exec prisma format --schema prisma/schema.prisma
          pnpm --filter @lcsp/api prisma:generate

      - name: Validate optimized schema
        run: pnpm --filter @lcsp/api exec prisma validate --schema prisma/schema.prisma

      - name: API dependency build and typecheck
        run: pnpm exec tsc -b packages/contracts packages/i18n apps/api

      - name: LikeC4 check
        run: pnpm likec4:check

      - name: Diff guard
        run: git diff --check
