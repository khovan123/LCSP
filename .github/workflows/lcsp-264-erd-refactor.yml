name: LCSP-264 optimized ERD refactor

on:
  push:
    branches:
      - refactor/LCSP-264-optimized-erd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/LCSP-264-optimized-erd
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply optimized auth schema and migration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          schema_path = Path('apps/api/prisma/schema.prisma')
          schema = schema_path.read_text()
          start = schema.index('model AuthUser {')
          end = schema.index('model OutboxMessage {')
          auth_block = r'''model User {
            id                        String                        @id
            email                     String                        @unique
            passwordHash              String
            emailVerified             Boolean
            failedLoginCount          Int
            lockUntil                 DateTime?
            displayName               String?
            recoveryEmail             String?
            primaryEmailAddressPolicy AuthPrimaryEmailAddressPolicy @default(ACCOUNT_EMAIL)
            backupEmailPolicy         AuthBackupEmailPolicy         @default(RECOVERY_EMAIL)
            role                      AuthUserRole                  @default(CUSTOMER)
            mfaRequired               Boolean                       @default(false)
            mfaEncryptedSecret        String?
            mfaEnrolledAt             DateTime?
            mfaVerifiedAt             DateTime?
            mfaFailedCount            Int                           @default(0)
            mfaLockedUntil            DateTime?
            createdAt                 DateTime                      @default(now())
            updatedAt                 DateTime                      @updatedAt
            approvedVerifiedProfiles  VerifiedProfile[]             @relation("VerifiedProfileApprover")
            assessmentOwners          Assessment[]                  @relation("AssessmentOwner")
            auditExportRequests       AuditExportRequest[]          @relation("AuditExportRequester")
            authRecords               AuthRecord[]
            classificationReviews     ClassificationReviewRequest[] @relation("ClassificationReviewRequester")
            documentRequests          DocumentRequest[]             @relation("DocumentRequestRequester")
            gitHubAppInstallStates    GitHubAppInstallState[]       @relation("GitHubAppInstallStateUser")
            readinessExports          ReadinessExport[]             @relation("ReadinessExportOwner")
            repositoryConnections     RepositoryConnection[]        @relation("RepositoryConnectionUser")
            repositorySnapshots       RepositorySnapshot[]          @relation("RepositorySnapshotActor")
            resolvedConflicts         ConflictRecord[]              @relation("ConflictRecordResolver")
            wizardProfiles            WizardProfile[]               @relation("WizardProfileOwner")
          }

          model AuthRecord {
            id         String         @id
            userId     String?
            type       AuthRecordType
            lookupKey  String         @unique
            secretHash String?
            expiresAt  DateTime?
            usedAt     DateTime?
            revokedAt  DateTime?
            metadata   Json?
            createdAt  DateTime       @default(now())
            updatedAt  DateTime       @updatedAt
            user       User?          @relation(fields: [userId], references: [id], onDelete: Cascade)

            @@index([userId, type])
            @@index([type, expiresAt])
            @@index([userId, type, revokedAt, usedAt])
          }

          enum AuthRecordType {
            SESSION
            MFA_OTP_USE
            MFA_RECOVERY_CODE
            RECOVERY_REQUEST
            OAUTH_IDENTITY
            OAUTH_STATE
          }

          enum AuthBackupEmailPolicy {
            ALL_VERIFIED
            RECOVERY_EMAIL
          }

          enum AuthPrimaryEmailAddressPolicy {
            ACCOUNT_EMAIL
            RECOVERY_EMAIL
          }

          model AuditEvent {
            id            String             @id
            eventType     String
            actorId       String?
            resourceType  AuditResourceType?
            resourceId    String?
            decision      AuthDecision?
            reasonCode    String?
            correlationId String
            sessionId     String?
            payload       Json
            createdAt     DateTime           @default(now())

            @@index([correlationId])
            @@index([actorId, createdAt])
            @@index([eventType, createdAt])
          }

          '''
          schema = schema[:start] + auth_block + schema[end:]
          schema = re.sub(r'\bAuthUser\b', 'User', schema)
          schema_path.write_text(schema)

          # Rename direct Prisma access that maps 1:1 to the new model names.
          for root in [Path('apps/api/src'), Path('apps/api/test'), Path('apps/api/scripts'), Path('scripts')]:
            if not root.exists():
              continue
            for path in root.rglob('*'):
              if path.suffix not in {'.ts', '.mjs', '.js'} or not path.is_file():
                continue
              text = path.read_text()
              text = text.replace('.authUser', '.user')
              text = text.replace('.authAuditEvent', '.auditEvent')
              text = text.replace('Prisma.AuthAuditEventWhereInput', 'Prisma.AuditEventWhereInput')
              path.write_text(text)

          migration = Path('apps/api/prisma/migrations/20260828170000_optimize_auth_erd')
          migration.mkdir(parents=True, exist_ok=True)
          migration.joinpath('migration.sql').write_text(r'''-- LCSP-264: collapse auth persistence to User + AuthRecord and generalize audit storage.

          ALTER TABLE "AuthUser" RENAME TO "User";

          ALTER TABLE "User"
            ADD COLUMN "mfaEncryptedSecret" TEXT,
            ADD COLUMN "mfaEnrolledAt" TIMESTAMP(3),
            ADD COLUMN "mfaVerifiedAt" TIMESTAMP(3),
            ADD COLUMN "mfaFailedCount" INTEGER NOT NULL DEFAULT 0,
            ADD COLUMN "mfaLockedUntil" TIMESTAMP(3);

          UPDATE "User" AS u
          SET
            "mfaEncryptedSecret" = m."encryptedSecret",
            "mfaEnrolledAt" = m."enrolledAt",
            "mfaVerifiedAt" = m."verifiedAt"
          FROM "AuthUserMfa" AS m
          WHERE u.id = m."userId";

          UPDATE "User" AS u
          SET
            "mfaFailedCount" = r."failedCount",
            "mfaLockedUntil" = r."lockedUntil"
          FROM "AuthMfaRateLimit" AS r
          WHERE u.id = r."userId";

          CREATE TYPE "AuthRecordType" AS ENUM (
            'SESSION',
            'MFA_OTP_USE',
            'MFA_RECOVERY_CODE',
            'RECOVERY_REQUEST',
            'OAUTH_IDENTITY',
            'OAUTH_STATE'
          );

          CREATE TABLE "AuthRecord" (
            "id" TEXT NOT NULL,
            "userId" TEXT,
            "type" "AuthRecordType" NOT NULL,
            "lookupKey" TEXT NOT NULL,
            "secretHash" TEXT,
            "expiresAt" TIMESTAMP(3),
            "usedAt" TIMESTAMP(3),
            "revokedAt" TIMESTAMP(3),
            "metadata" JSONB,
            "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            "updatedAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            CONSTRAINT "AuthRecord_pkey" PRIMARY KEY ("id"),
            CONSTRAINT "AuthRecord_userId_fkey" FOREIGN KEY ("userId") REFERENCES "User"("id") ON DELETE CASCADE ON UPDATE CASCADE
          );

          CREATE UNIQUE INDEX "AuthRecord_lookupKey_key" ON "AuthRecord"("lookupKey");
          CREATE INDEX "AuthRecord_userId_type_idx" ON "AuthRecord"("userId", "type");
          CREATE INDEX "AuthRecord_type_expiresAt_idx" ON "AuthRecord"("type", "expiresAt");
          CREATE INDEX "AuthRecord_userId_type_revokedAt_usedAt_idx" ON "AuthRecord"("userId", "type", "revokedAt", "usedAt");

          INSERT INTO "AuthRecord" ("id", "userId", "type", "lookupKey", "secretHash", "expiresAt", "revokedAt", "metadata", "createdAt", "updatedAt")
          SELECT
            s.id,
            s."userId",
            'SESSION'::"AuthRecordType",
            'SESSION:' || s."tokenFingerprint",
            s."tokenHash",
            s."expiresAt",
            s."revokedAt",
            jsonb_build_object(
              'tokenFingerprint', s."tokenFingerprint",
              'mfaVerifiedAt', CASE WHEN s."mfaVerifiedAt" IS NULL THEN NULL ELSE to_jsonb(s."mfaVerifiedAt"::text) END,
              'sensitiveActionVerifiedAt', CASE WHEN s."sensitiveActionVerifiedAt" IS NULL THEN NULL ELSE to_jsonb(s."sensitiveActionVerifiedAt"::text) END
            ),
            s."createdAt",
            s."updatedAt"
          FROM "AuthSession" s;

          INSERT INTO "AuthRecord" ("id", "userId", "type", "lookupKey", "usedAt", "metadata", "createdAt", "updatedAt")
          SELECT
            m."userId" || ':otp:' || m."otpCode",
            m."userId",
            'MFA_OTP_USE'::"AuthRecordType",
            'MFA_OTP_USE:' || m."userId" || ':' || m."otpCode",
            m."usedAt",
            jsonb_build_object('otpCode', m."otpCode"),
            m."usedAt",
            m."usedAt"
          FROM "AuthMfaOtpUsed" m;

          INSERT INTO "AuthRecord" ("id", "userId", "type", "lookupKey", "secretHash", "usedAt", "revokedAt", "metadata", "createdAt", "updatedAt")
          SELECT
            r.id,
            r."userId",
            'MFA_RECOVERY_CODE'::"AuthRecordType",
            'MFA_RECOVERY_CODE:' || r."userId" || ':' || r."codeHash",
            r."codeHash",
            r."usedAt",
            r."revokedAt",
            jsonb_build_object('batchId', r."batchId"),
            r."generatedAt",
            r."generatedAt"
          FROM "AuthMfaRecoveryCode" r;

          INSERT INTO "AuthRecord" ("id", "userId", "type", "lookupKey", "secretHash", "expiresAt", "usedAt", "metadata", "createdAt", "updatedAt")
          SELECT
            r.id,
            r."userId",
            'RECOVERY_REQUEST'::"AuthRecordType",
            'RECOVERY_REQUEST:' || r."tokenFingerprint",
            r."tokenHash",
            r."expiresAt",
            r."consumedAt",
            jsonb_build_object('tokenFingerprint', r."tokenFingerprint"),
            r."createdAt",
            r."createdAt"
          FROM "AuthRecoveryRequest" r;

          INSERT INTO "AuthRecord" ("id", "userId", "type", "lookupKey", "expiresAt", "metadata", "createdAt", "updatedAt")
          SELECT
            s.id,
            s."userId",
            'OAUTH_STATE'::"AuthRecordType",
            'OAUTH_STATE:' || s.state,
            s."expiresAt",
            jsonb_build_object(
              'state', s.state,
              'nonce', s.nonce,
              'provider', s.provider,
              'redirectUri', s."redirectUri",
              'sessionId', s."sessionId"
            ),
            s."createdAt",
            s."createdAt"
          FROM "AuthOAuthState" s;

          INSERT INTO "AuthRecord" ("id", "userId", "type", "lookupKey", "metadata", "createdAt", "updatedAt")
          SELECT
            i.id,
            i."userId",
            'OAUTH_IDENTITY'::"AuthRecordType",
            'OAUTH_IDENTITY:' || i.provider || ':' || i."providerAccountId",
            jsonb_build_object('provider', i.provider, 'providerAccountId', i."providerAccountId"),
            i."createdAt",
            i."createdAt"
          FROM "AuthOAuthIdentity" i;

          ALTER TABLE "AuthAuditEvent" RENAME TO "AuditEvent";

          INSERT INTO "AuditEvent" (
            "id", "eventType", "actorId", "resourceType", "resourceId", "decision", "reasonCode", "correlationId", "sessionId", "payload", "createdAt"
          )
          SELECT
            d.id,
            'AUTHORIZATION_DECISION',
            d."actorId",
            d."resourceType",
            d."resourceId",
            d.decision,
            d."reasonCode"::text,
            d."correlationId",
            d."sessionId",
            d.payload,
            d."createdAt"
          FROM "AuthDecisionLog" d
          ON CONFLICT ("id") DO NOTHING;

          DROP TABLE "AuthOAuthState";
          DROP TABLE "AuthOAuthIdentity";
          DROP TABLE "AuthRecoveryRequest";
          DROP TABLE "AuthMfaRecoveryCode";
          DROP TABLE "AuthMfaOtpUsed";
          DROP TABLE "AuthMfaRateLimit";
          DROP TABLE "AuthUserMfa";
          DROP TABLE "AuthSession";
          DROP TABLE "AuthDecisionLog";
          ''')
          PY

          pnpm exec prisma format --schema apps/api/prisma/schema.prisma

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @lcsp/api prisma:generate

      - name: Show residual legacy persistence references
        if: always()
        shell: bash
        run: |
          grep -RInE '\b(AuthUser|AuthSession|AuthUserMfa|AuthMfaOtpUsed|AuthMfaRateLimit|AuthMfaRecoveryCode|AuthRecoveryRequest|AuthOAuthIdentity|AuthOAuthState|AuthAuditEvent|AuthDecisionLog)\b|\.(authSession|authUserMfa|authMfaOtpUsed|authMfaRateLimit|authMfaRecoveryCode|authRecoveryRequest|authOAuthIdentity|authOAuthState|authDecisionLog)\b' apps/api/src apps/api/test apps/api/scripts scripts likec4 || true

      - name: Typecheck
        run: pnpm run typecheck
