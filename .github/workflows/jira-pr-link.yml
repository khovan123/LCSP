name: Jira PR Link

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - closed

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  jira-link:
    name: Require Jira issue key
    runs-on: ubuntu-latest
    steps:
      - name: Validate Jira issue key and close comment
        uses: actions/github-script@v7
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL || 'https://minhpnq1807.atlassian.net' }}
          JIRA_PROJECT_KEY: LCSP
        with:
          script: |
            const marker = '<!-- lcsp-jira-close-comment -->';
            const jiraBaseUrl = process.env.JIRA_BASE_URL.replace(/\/$/, '');
            const projectKey = process.env.JIRA_PROJECT_KEY;
            const issueKeyPattern = new RegExp(`\\b${projectKey}-\\d+\\b`, 'gi');
            const pr = context.payload.pull_request;

            const searchText = [
              pr.title,
              pr.body || '',
              pr.head.ref,
            ].join('\n');

            const issueKeys = [...new Set(
              (searchText.match(issueKeyPattern) || []).map((key) => key.toUpperCase()),
            )];

            if (issueKeys.length === 0) {
              core.setFailed(
                `Missing Jira issue key. Add a ${projectKey}-123 style key to the PR title, body, or branch name.`,
              );
              return;
            }

            core.notice(`Detected Jira issue keys: ${issueKeys.join(', ')}`);

            if (context.payload.action !== 'closed') {
              return;
            }

            const state = pr.merged ? 'merged' : 'closed without merge';
            const issueLinks = issueKeys
              .map((key) => `- [${key}](${jiraBaseUrl}/browse/${key})`)
              .join('\n');

            const body = `${marker}
            ## Jira closure

            PR #${pr.number} was ${state}.

            ${issueLinks}
            `.replace(/^ {12}/gm, '').trim();

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
