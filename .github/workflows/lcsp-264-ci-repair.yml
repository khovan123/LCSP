name: LCSP-264 CI repair

on:
  push:
    branches:
      - refactor/LCSP-264-optimized-erd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/LCSP-264-optimized-erd
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Align AuditEvent mocks and remove stale imports
        run: |
          python3 <<'PY'
          from pathlib import Path

          mock_paths = [
              "apps/api/src/platform/audit/audit-writer.service.spec.ts",
              "apps/api/src/modules/scan/application/commands/process-scan-callback/process-scan-callback.handler.spec.ts",
              "apps/api/src/modules/evidence/application/commands/accept-technical-profile/accept-technical-profile.handler.spec.ts",
              "apps/api/src/modules/audit/application/queries/list-audit-events/list-audit-events.handler.spec.ts",
              "apps/api/src/modules/audit/application/commands/export-audit-trail/export-audit-trail.handler.spec.ts",
              "apps/api/src/modules/document/application/commands/process-document-callback/process-document-callback.handler.spec.ts",
          ]
          for item in mock_paths:
              path = Path(item)
              text = path.read_text()
              text = text.replace("authAuditEvent", "auditEvent")
              path.write_text(text)

          path = Path("apps/api/test/auth-workspace.e2e-spec.ts")
          text = path.read_text()
          text = text.replace(
              '    const { hashSecret, fingerprintToken } =\n      await import("../src/modules/auth-workspace/infrastructure/security/security.utils.js");\n',
              "",
          )
          path.write_text(text)

          path = Path("apps/api/test/support/auth-workspace-test-helpers.ts")
          text = path.read_text()
          text = text.replace("  fingerprintToken,\n", "")
          text = text.replace(
              "  await prisma.auditEvent.deleteMany();\n  await prisma.auditEvent.deleteMany();\n",
              "  await prisma.auditEvent.deleteMany();\n",
          )
          path.write_text(text)
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/lcsp_api_test?schema=public
        run: pnpm --filter @lcsp/api prisma:generate

      - name: Lint API
        run: pnpm --filter @lcsp/api lint

      - name: Run API unit tests
        run: pnpm --filter @lcsp/api test

      - name: Typecheck API
        run: pnpm exec tsc -b packages/contracts packages/i18n apps/api

      - name: Remove repair workflow
        run: rm -f .github/workflows/lcsp-264-ci-repair.yml

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(api): LCSP-264 align AuditEvent fixtures"
          git push origin HEAD:refactor/LCSP-264-optimized-erd
