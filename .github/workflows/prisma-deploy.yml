name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Prisma Compute
        id: deploy
        run: |
          npx --yes @prisma/cli@latest app deploy \
            --project proj_cmrcdus2n0gjj1cgjp0qkrhyo \
            --prod --yes --no-interactive --json
        env:
          PRISMA_SERVICE_TOKEN: ${{ secrets.PRISMA_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
