name: Remap PR milestones once

on:
  pull_request_target:
    types: [edited]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  remap:
    if: github.event.pull_request.number == 272
    runs-on: ubuntu-latest
    steps:
      - name: Remap every pull request to delivery milestone
        uses: actions/github-script@v7
        with:
          script: |
            const expected = {
              foundation: ['Foundation & Assessment Baseline', 6],
              evidence: ['Evidence & Legal Baseline', 7],
              architecture: ['Architecture Stabilization & Repository Integration', 8],
              workflow: ['End-to-End Compliance Workflow', 9],
              reassessment: ['Reassessment & Automated Updates', 10],
              release: ['Capstone Release Candidate', 11],
              agentic: ['Agentic Compliance Runtime', 12],
            };
            const milestones = await github.paginate(github.rest.issues.listMilestones, {owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100});
            const byTitle = new Map(milestones.map(m => [m.title, m.number]));
            for (const [, [title, number]] of Object.entries(expected)) {
              if (byTitle.get(title) !== number) throw new Error(`Milestone mismatch: ${title} must be #${number}`);
            }
            const pulls = await github.paginate(github.rest.pulls.list, {owner: context.repo.owner, repo: context.repo.repo, state: 'all', sort: 'created', direction: 'asc', per_page: 100});
            const hasAny = (t, xs) => xs.some(x => t.includes(x));
            const jiraKeys = t => new Set([...t.matchAll(/LCSP-(\d+)/gi)].map(m => Number(m[1])));
            const hasKey = (s, xs) => xs.some(x => s.has(x));
            function pick(pr) {
              const t = `${pr.title || ''}\n${pr.body || ''}\n${pr.head?.ref || ''}`.toLowerCase();
              const k = jiraKeys(t);
              if (hasKey(k,[232,236,240,245,246]) || hasAny(t,['architecture stabilization','github cli repository access','replace policy by role access','user.role rbac','program evidence graph ui','multi repo with technical declaration'])) return 8;
              if (hasKey(k,[187,188,189,190,231]) || hasAny(t,['reassessment','re-assessment','reanalysis','re-analysis','source version comparison','source version reassessment','incremental context update','legal detect change','legal change detection','scheduled legal','scheduled corpus','cronjob legal','corpus change detection'])) return 10;
              if (hasKey(k,[157,158,159,160,161,162,163,164,165,166,167,168,169,170,171,172,173,174,175,176,177,178,179,180,181,182,183,184,185,186,191,192,193,194,195,196,197,198,199,200,201,202,203,204,205,206,207,208,209,210,211,212,213,214,215,216,217,218,220,221,222,223,224,225,226,227,228,229,230,241,244]) || hasAny(t,['deep agent','deep-agent','agentic evidence','managed runtime','engineeringrule','engineering rule','investigation planner','controlled investigation','llm investigation','native tools','planner scope','langgraph','tool packet','evidence tool','agent orchestration'])) return 12;
              if (hasAny(t,['gap analysis','final report','compliance report','classification result','classification worker','classification status','risk classification','conflict resolution','conflict detection','list conflicts','resolve conflict','reconciliation','verified profile','human review','independent review','audit export','assessment audit trail','redacted audit trail'])) return 9;
              if (hasAny(t,['scanner','scan job','scan trigger','technical evidence','evidence report','evidence graph','program evidence graph','legal corpus','legal source','legal rule','legal matching','legal-rule','sbom','syft','semgrep','ast/cst','python ast','ts-morph','tree-sitter','tree sitter','chromadb','citation retrieval','citation allowlist','technical profile','ai usage flow','dependency usage analysis','manifest and config parser','signal fusion'])) return 7;
              if (hasAny(t,['capstone','release candidate','release engineering','deployment','deploy ','docker','github actions','workflow','ci:','fix(ci)','chore(ci)','branch naming','branch guard','commit message guard','husky','landing page','report 1','report 2','report 3','report1_','report2_','report3_'])) return 11;
              return 6;
            }
            const counts = new Map();
            for (const pr of pulls) {
              const milestone = pick(pr);
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, milestone});
              counts.set(milestone, (counts.get(milestone) || 0) + 1);
            }
            core.info(`Updated ${pulls.length} PRs`);
            for (const [, [title, number]] of Object.entries(expected)) core.info(`${title} (#${number}): ${counts.get(number) || 0}`);
            await core.summary.addHeading('LCSP PR milestone remap').addTable([[{data:'Milestone',header:true},{data:'Number',header:true},{data:'PRs',header:true}],...Object.values(expected).map(([title,number])=>[title,String(number),String(counts.get(number)||0)])]).addRaw(`\nTotal PRs updated: ${pulls.length}\n`).write();
