[project]
name = "lcsp-workers"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
  "pika==1.3.2",
  "httpx==0.27.2",
  "structlog==24.4.0",
  "python-dotenv==1.0.1",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "pytest-mock==3.14.0",
]

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcsp_workers"]
