[project]
name = "lcsp-workers"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
  "pika==1.3.2",
  "httpx==0.28.1",
  "requests>=2.32.0,<3.0.0",
  "certifi>=2025.0.0",
  "structlog==24.4.0",
  "python-dotenv==1.0.1",
  "pydantic>=2.0.0",
  "openai==1.59.3",
  "anthropic==0.42.0",
  "redis==5.2.1",
  "tiktoken==0.8.0",
  "boto3==1.34.144",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-postgres==3.1.0",
  "google-genai==2.13.0",
  "chromadb==1.5.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.4.0",
  "pytest-mock==3.14.0",
]

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcsp_workers", "src/package"]
