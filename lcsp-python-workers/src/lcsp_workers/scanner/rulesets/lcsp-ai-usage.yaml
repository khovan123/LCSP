options:
  symbolic_propagation: true
metadata:
  lcsp_version: "1.0"
  strip_source: true

rules:
  - id: lcsp-openai-chat-completions-py
    message: OpenAI chat completions API call
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: openai.ChatCompletion.create(...)
      - pattern: $CLIENT.chat.completions.create(...)
      - pattern: $CLIENT.responses.create(...)
    metadata:
      finding_type: AI_PROVIDER_USAGE
      base_confidence: 0.90
      library_group: openai

  - id: lcsp-openai-embeddings-py
    message: OpenAI embeddings API call
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: openai.Embedding.create(...)
      - pattern: $CLIENT.embeddings.create(...)
    metadata:
      finding_type: AI_PROVIDER_USAGE
      base_confidence: 0.90
      library_group: openai

  - id: lcsp-openai-chat-completions-js
    message: OpenAI chat completions API call
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: $CLIENT.chat.completions.create(...)
      - pattern: openai.chat.completions.create(...)
    metadata:
      finding_type: AI_PROVIDER_USAGE
      base_confidence: 0.90
      library_group: openai

  - id: lcsp-openai-embeddings-js
    message: OpenAI embeddings API call
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: $CLIENT.embeddings.create(...)
      - pattern: openai.embeddings.create(...)
    metadata:
      finding_type: AI_PROVIDER_USAGE
      base_confidence: 0.90
      library_group: openai

  - id: lcsp-anthropic-messages-py
    message: Anthropic messages API call
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: $CLIENT.messages.create(...)
      - pattern: anthropic.Anthropic().messages.create(...)
    metadata:
      finding_type: AI_PROVIDER_USAGE
      base_confidence: 0.90
      library_group: anthropic

  - id: lcsp-anthropic-messages-js
    message: Anthropic messages API call
    severity: WARNING
    languages: [javascript, typescript]
    pattern: $CLIENT.messages.create(...)
    metadata:
      finding_type: AI_PROVIDER_USAGE
      base_confidence: 0.90
      library_group: anthropic

  - id: lcsp-google-genai-py
    message: Google Generative AI model call
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: $MODEL.generate_content(...)
      - pattern: genai.GenerativeModel(...)
      - pattern: GenerativeModel(...)
    metadata:
      finding_type: AI_PROVIDER_USAGE
      base_confidence: 0.90
      library_group: google-genai

  - id: lcsp-vertexai-predict-py
    message: Vertex AI predict call
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: $MODEL.predict(...)
      - pattern: $ENDPOINT.predict(...)
    metadata:
      finding_type: AI_PROVIDER_USAGE
      base_confidence: 0.80
      library_group: google-vertex

  - id: lcsp-google-genai-js
    message: Google Generative AI model call
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: $MODEL.generateContent(...)
      - pattern: genAI.getGenerativeModel(...)
    metadata:
      finding_type: AI_PROVIDER_USAGE
      base_confidence: 0.90
      library_group: google-genai

  - id: lcsp-hf-pipeline-py
    message: Hugging Face transformers pipeline or model load
    severity: INFO
    languages: [python]
    pattern-either:
      - pattern: pipeline(...)
      - pattern: AutoModelForCausalLM.from_pretrained(...)
      - pattern: AutoModelForSequenceClassification.from_pretrained(...)
      - pattern: AutoTokenizer.from_pretrained(...)
    metadata:
      finding_type: AI_FRAMEWORK_USAGE
      base_confidence: 0.80
      library_group: huggingface

  - id: lcsp-hf-inference-api-py
    message: Hugging Face Inference API call
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: InferenceClient(...)
      - pattern: $CLIENT.text_generation(...)
      - pattern: $CLIENT.question_answering(...)
    metadata:
      finding_type: AI_PROVIDER_USAGE
      base_confidence: 0.80
      library_group: huggingface

  - id: lcsp-hf-inference-api-js
    message: Hugging Face Inference API call
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: new HfInference(...)
      - pattern: $HF.textGeneration(...)
      - pattern: $HF.questionAnswering(...)
    metadata:
      finding_type: AI_PROVIDER_USAGE
      base_confidence: 0.80
      library_group: huggingface

  - id: lcsp-langchain-chain-invoke-py
    message: LangChain chain invocation
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: $CHAIN.invoke(...)
      - pattern: $CHAIN.run(...)
      - pattern: $CHAIN.stream(...)
      - pattern: $CHAIN.batch(...)
    metadata:
      finding_type: AI_FRAMEWORK_USAGE
      base_confidence: 0.85
      library_group: langchain

  - id: lcsp-langchain-chain-invoke-js
    message: LangChain chain invocation
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: $CHAIN.invoke(...)
      - pattern: $CHAIN.stream(...)
      - pattern: new ChatOpenAI(...)
      - pattern: new ChatAnthropic(...)
    metadata:
      finding_type: AI_FRAMEWORK_USAGE
      base_confidence: 0.85
      library_group: langchain

  - id: lcsp-langchain-prompt-py
    message: LangChain prompt template
    severity: INFO
    languages: [python]
    pattern-either:
      - pattern: ChatPromptTemplate.from_messages(...)
      - pattern: PromptTemplate.from_template(...)
      - pattern: SystemMessagePromptTemplate.from_template(...)
    metadata:
      finding_type: SYSTEM_PROMPT_DETECTED
      base_confidence: 0.80
      library_group: langchain

  - id: lcsp-langchain-prompt-js
    message: LangChain prompt template
    severity: INFO
    languages: [javascript, typescript]
    pattern-either:
      - pattern: ChatPromptTemplate.fromMessages(...)
      - pattern: PromptTemplate.fromTemplate(...)
    metadata:
      finding_type: SYSTEM_PROMPT_DETECTED
      base_confidence: 0.80
      library_group: langchain

  - id: lcsp-langchain-agent-py
    message: LangChain agent execution
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: AgentExecutor(...)
      - pattern: create_react_agent(...)
      - pattern: create_openai_functions_agent(...)
      - pattern: $AGENT.invoke(...)
    metadata:
      finding_type: AI_DECISION_FLOW_SIGNAL
      base_confidence: 0.75
      library_group: langchain

  - id: lcsp-langchain-rag-py
    message: LangChain RAG retrieval
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: RetrievalQA.from_chain_type(...)
      - pattern: $RETRIEVER.invoke(...)
      - pattern: VectorStoreRetriever(...)
    metadata:
      finding_type: RAG_USAGE_SIGNAL
      base_confidence: 0.85
      library_group: langchain

  - id: lcsp-langchain-rag-js
    message: LangChain RAG retrieval
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: createRetrievalChain(...)
      - pattern: new VectorStoreRetriever(...)
    metadata:
      finding_type: RAG_USAGE_SIGNAL
      base_confidence: 0.85
      library_group: langchain

  - id: lcsp-langchain-output-parser-py
    message: LangChain output parser
    severity: INFO
    languages: [python]
    pattern-either:
      - pattern: PydanticOutputParser(...)
      - pattern: JsonOutputParser(...)
      - pattern: StrOutputParser(...)
      - pattern: CommaSeparatedListOutputParser(...)
    metadata:
      finding_type: MODEL_OUTPUT_PARSER_SIGNAL
      base_confidence: 0.80
      library_group: langchain

  - id: lcsp-langchain-output-parser-js
    message: LangChain output parser
    severity: INFO
    languages: [javascript, typescript]
    pattern-either:
      - pattern: new JsonOutputParser(...)
      - pattern: new StructuredOutputParser(...)
      - pattern: StructuredOutputParser.fromNamesAndDescriptions(...)
    metadata:
      finding_type: MODEL_OUTPUT_PARSER_SIGNAL
      base_confidence: 0.80
      library_group: langchain

  - id: lcsp-llamaindex-query-py
    message: LlamaIndex query engine
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: $INDEX.as_query_engine(...)
      - pattern: $QUERY_ENGINE.query(...)
      - pattern: VectorStoreIndex.from_documents(...)
    metadata:
      finding_type: RAG_USAGE_SIGNAL
      base_confidence: 0.85
      library_group: llamaindex

  - id: lcsp-llamaindex-query-js
    message: LlamaIndex query engine
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: VectorStoreIndex.fromDocuments(...)
      - pattern: $INDEX.asQueryEngine(...)
      - pattern: $QUERY_ENGINE.query(...)
    metadata:
      finding_type: RAG_USAGE_SIGNAL
      base_confidence: 0.85
      library_group: llamaindex

  - id: lcsp-sklearn-predict-py
    message: scikit-learn model prediction
    severity: WARNING
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $MODEL.predict(...)
          - pattern: $CLF.predict(...)
          - pattern: $MODEL.predict_proba(...)
      - pattern-either:
          - pattern-inside: |
              import sklearn
              ...
          - pattern-inside: |
              from sklearn... import ...
              ...
    metadata:
      finding_type: AI_PROVIDER_USAGE
      base_confidence: 0.65
      library_group: sklearn

  - id: lcsp-tf-predict-py
    message: TensorFlow/Keras model call
    severity: WARNING
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $MODEL.predict(...)
          - pattern: $MODEL(...)
      - pattern-either:
          - pattern-inside: |
              import tensorflow
              ...
          - pattern-inside: |
              from tensorflow... import ...
              ...
          - pattern-inside: |
              import keras
              ...
          - pattern-inside: |
              from keras... import ...
              ...
    metadata:
      finding_type: AI_PROVIDER_USAGE
      base_confidence: 0.70
      library_group: tensorflow

  - id: lcsp-torch-inference-py
    message: PyTorch model inference
    severity: WARNING
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: |
              with torch.no_grad():
                  ...
          - pattern: $MODEL($INPUT)
      - pattern-either:
          - pattern-inside: |
              import torch
              ...
          - pattern-inside: |
              from torch... import ...
              ...
    metadata:
      finding_type: AI_PROVIDER_USAGE
      base_confidence: 0.65
      library_group: pytorch

  - id: lcsp-local-inference-endpoint-py
    message: Local LLM inference endpoint call
    severity: WARNING
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: requests.post(...)
          - pattern: httpx.post(...)
          - pattern: $CLIENT.post(...)
      - pattern-regex: "localhost:11434|/v1/chat/completions|/api/generate"
    metadata:
      finding_type: AI_PROVIDER_USAGE
      base_confidence: 0.75
      library_group: local-inference

  - id: lcsp-local-inference-endpoint-js
    message: Local LLM inference endpoint call
    severity: WARNING
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: fetch(...)
          - pattern: $CLIENT.post(...)
          - pattern: ollama.chat(...)
      - pattern-regex: "localhost:11434|/v1/chat/completions|/api/generate"
    metadata:
      finding_type: AI_PROVIDER_USAGE
      base_confidence: 0.75
      library_group: local-inference

  - id: lcsp-generic-generate-py
    message: Generic generate, infer, classify, or score call
    severity: INFO
    languages: [python]
    pattern-either:
      - pattern: $OBJ.generate(...)
      - pattern: $OBJ.infer(...)
      - pattern: $OBJ.classify(...)
      - pattern: $OBJ.score(...)
    metadata:
      finding_type: AI_PROVIDER_USAGE
      base_confidence: 0.40
      library_group: generic

  - id: lcsp-generic-generate-js
    message: Generic generate, infer, classify, or predict call
    severity: INFO
    languages: [javascript, typescript]
    pattern-either:
      - pattern: $OBJ.generate(...)
      - pattern: $OBJ.infer(...)
      - pattern: $OBJ.classify(...)
      - pattern: $OBJ.predict(...)
    metadata:
      finding_type: AI_PROVIDER_USAGE
      base_confidence: 0.40
      library_group: generic

  - id: lcsp-system-prompt-var-py
    message: System prompt variable detected
    severity: INFO
    languages: [python]
    pattern-either:
      - pattern: system_prompt = ...
      - pattern: SYSTEM_PROMPT = ...
      - pattern: SystemMessage(content=...)
    metadata:
      finding_type: SYSTEM_PROMPT_DETECTED
      base_confidence: 0.70
      library_group: generic

  - id: lcsp-system-prompt-var-js
    message: System prompt variable detected
    severity: INFO
    languages: [javascript, typescript]
    pattern-regex: "\\b(systemPrompt|SYSTEM_PROMPT|SystemMessage)\\b"
    metadata:
      finding_type: SYSTEM_PROMPT_DETECTED
      base_confidence: 0.70
      library_group: generic

  - id: lcsp-dynamic-prompt-py
    message: Dynamic system prompt reference
    severity: INFO
    languages: [python]
    pattern-either:
      - pattern: $TEMPLATE.format(...)
      - pattern: $TEMPLATE.format_map(...)
      - pattern: $TEMPLATE.render(...)
    metadata:
      finding_type: DYNAMIC_SYSTEM_PROMPT_REFERENCE
      base_confidence: 0.65
      library_group: generic

  - id: lcsp-dynamic-prompt-js
    message: Dynamic system prompt reference
    severity: INFO
    languages: [javascript, typescript]
    pattern-either:
      - pattern: $TEMPLATE.format(...)
      - pattern: $TEMPLATE.render(...)
      - pattern-regex: "\\$\\{systemPrompt\\}"
    metadata:
      finding_type: DYNAMIC_SYSTEM_PROMPT_REFERENCE
      base_confidence: 0.65
      library_group: generic
