[project]
name = "lcsp-managed-deepagents"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
  "httpx==0.28.1",
  "requests>=2.32.0,<3.0.0",
  "certifi>=2025.0.0",
  "structlog==24.4.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.0.0",
  "jsonschema>=4.23.0,<5.0.0",
  "openai>=1.59.3",
  "anthropic>=0.42.0",
  "redis==5.2.1",
  "tiktoken>=0.8.0",
  "boto3>=1.34.144",
  "deepagents>=0.7.0",
  "managed-deepagents>=0.4.0",
  "langchain-quickjs>=0.2.0",
  "langchain[openai,anthropic,google-genai]>=1.0.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-postgres==3.1.0",
  "arize-phoenix-otel>=0.17.0",
  "psycopg[binary]==3.3.4",
  "libcst==1.8.6",
  "deptry==0.25.1",
  "google-genai>=2.13.0",
  "chromadb==1.5.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.4.0",
  "pytest-mock==3.14.0",
]

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "tools",
]
