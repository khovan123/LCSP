rules:
  - id: lcsp.secret-openai-key
    message: Potential OpenAI secret detected
    severity: WARNING
    languages: [generic]
    pattern-regex: '(?i)sk-[a-z0-9_-]{10,}'

  - id: lcsp.secret-anthropic-key
    message: Potential Anthropic secret detected
    severity: WARNING
    languages: [generic]
    pattern-regex: '(?i)sk-ant-[a-z0-9_-]{10,}'

  - id: lcsp.secret-github-token
    message: Potential GitHub token detected
    severity: WARNING
    languages: [generic]
    pattern-regex: '(?i)ghp_[a-z0-9]{10,}'
