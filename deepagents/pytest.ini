[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test
python_functions = test_
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
log_cli = true
log_cli_level = INFO
markers =
    p0: P0 acceptance criteria (security, PBAC, data integrity, compliance)
    p1: P1 acceptance criteria (functional correctness)
    unit: pure unit tests (no I/O)
    integration: tests requiring external services or filesystem
    e2e: end-to-end smoke coverage through consumer handle() and real graph wrappers
